name: Publish to crates.io

# Plan 185 TASK-11. Publishes the Rust SDK (`revturbine`) to crates.io on a
# rust-v* release tag, pushed here by the source-mirror pipeline
# (revturbine-sdk-internal → publish-to-public.yml).
#
# Mirrors release-pypi.yml's shape, with one deliberate difference: PyPI uses
# Trusted Publishing (OIDC, no stored token); crates.io has no OIDC equivalent,
# so this needs a CARGO_REGISTRY_TOKEN repository secret.
#
# The publish happens HERE, from the public repo, because the private source
# repo is cut off from the org token by design.
#
# FIRST PUBLISH CLAIMS THE NAME. `revturbine` is unregistered and crates.io has
# no reservation mechanism, so whichever run lands first owns it. Versions can
# be yanked but never deleted.

on:
  push:
    tags:
      - 'rust-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. rust-v0.2.86)'
        required: true

permissions:
  contents: read

concurrency:
  group: crates-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "version=${TAG#rust-v}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${TAG#rust-v}"

      - name: Assert Cargo.toml version matches the tag
        working-directory: server-rust
        run: |
          set -euo pipefail
          # Anchored + `head -1`: Cargo.toml also carries `rust-version`, and
          # every dependency table carries its own `version` key.
          RS_VERSION=$(grep -E '^version[[:space:]]*=' Cargo.toml | head -1 \
            | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          if [ "$RS_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Cargo.toml version ($RS_VERSION) != tag (${{ steps.version.outputs.version }})"
            exit 1
          fi
          echo "Version match: $RS_VERSION"

      # Packaging is verified before upload so a malformed crate fails on a
      # step that changes nothing, rather than half-way through a publish that
      # cannot be undone.
      - name: Package (dry run)
        working-directory: server-rust
        run: cargo publish --dry-run --locked

      - name: Publish to crates.io
        working-directory: server-rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
